name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

# LIBO-12: least privilege. This job holds the production deploy credential; it
# only needs to read the repo (the FTP push is external), so deny everything else.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── Build React app ──
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # Use the reviewed lockfile exactly; a dependency mismatch stops the
      # deployment instead of silently changing the production bundle.
      - run: npm ci --no-audit --no-fund
        working-directory: react-app

      # Run the same checks used on pull requests against the exact dependency
      # install that will build this deploy. A failing check stops publication.
      - name: Lint React app
        run: npm run lint
        working-directory: react-app

      - name: Test React app
        run: npm run test:run
        working-directory: react-app

      # tsc catches pure type errors that vite's bundle-time check misses
      # (mismatched signatures, narrowing bugs, etc). Cheap — runs in ~2s.
      - name: Type-check React app
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: react-app

      # Vite inlines `import.meta.env.VITE_*` at build time, so the
      # secrets must be present in the build step's env. Configure these
      # in repo settings → Secrets and variables → Actions:
      #   - VITE_SUPABASE_URL          (required — module load throws if missing)
      #   - VITE_SUPABASE_ANON_KEY     (required — anon JWT for the project)
      #   - VITE_STRIPE_PUBLISHABLE_KEY (optional — pk_live_… or pk_test_…;
      #     funnel falls back to offline placeholder when absent)
      #   - VITE_STRIPE_PRICE_ENTRY / _SILVER / _GOLD / _PREMIUM (optional)
      #
      # `npm run build` runs `prebuild:facets && tsc -b && vite build && postbuild:seo`,
      # which generates workout facets, sitemap.xml, and prerenders per-route
      # meta tags into dist/exercises/<slug>/index.html etc.
      - name: Build React app
        run: npm run build
        working-directory: react-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_ENTRY: ${{ secrets.VITE_STRIPE_PRICE_ENTRY }}
          VITE_STRIPE_PRICE_SILVER: ${{ secrets.VITE_STRIPE_PRICE_SILVER }}
          VITE_STRIPE_PRICE_GOLD: ${{ secrets.VITE_STRIPE_PRICE_GOLD }}
          VITE_STRIPE_PRICE_PREMIUM: ${{ secrets.VITE_STRIPE_PRICE_PREMIUM }}

      # ── Merge root static files into dist ──
      # The root index.html is the main landing page.
      # Copy it + supporting files into the React dist folder
      # so everything deploys together in one FTP push.
      - name: Copy root static files into dist
        run: |
          cp -r i18n react-app/dist/i18n
          cp tokens.css react-app/dist/tokens.css
          cp robots.txt react-app/dist/robots.txt
          cp sitemap.xml react-app/dist/sitemap.xml
          cp googlea384516e7c52bfef.html react-app/dist/ 2>/dev/null || true

      # ── Deploy everything ──
      # LIBO-06 (Dimitri audit): deploy over encrypted FTPS, not plaintext FTP.
      # The action defaults to protocol: ftp, which sends the FTP credential and
      # the whole site in cleartext — an on-path attacker can capture the login
      # or rewrite the bundle. Netcup shared hosting supports explicit FTPS on
      # port 21; `security: strict` enforces certificate validation.
      #
      # SFTP would be preferable, but this action only speaks ftp/ftps — moving
      # to SFTP means a different action and an SSH deploy key, which is Phase 3.
      # The action is pinned to the full commit SHA of v4.3.5 (mutable tags are a
      # supply-chain vector for a job that holds production deploy credentials).
      #
      # Certificate verification is mandatory. If FTP_HOST is an IP address or
      # alias absent from Netcup's certificate, the deploy fails closed. Set
      # FTP_HOST to a hostname covered by the server certificate, or migrate
      # the main hosting account to SFTP before merging this change.
      # Rotate FTP_PASSWORD after verifying the secure transport; the old
      # credential was previously sent via plaintext FTP.
      - name: Deploy via FTPS to Netcup
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: react-app/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      # ── Shout when it breaks ──
      # A red deploy is otherwise silent: 51e0a7e failed the type-check on
      # 2026-08-21 and nothing shipped for a day before anyone noticed, with
      # three later commits queued behind it. Failure-only on purpose — a ping
      # for every green build is noise, and noise is what gets muted.
      #
      # Needs a DISCORD_DEPLOY_WEBHOOK secret. Without it the step no-ops
      # rather than failing, so a missing secret can never be the reason a
      # deploy looks broken.
      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping alert."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # jq -Rs handles quotes, newlines and backticks in the commit subject,
          # which a hand-rolled JSON string would break on.
          PAYLOAD=$(jq -n \
            --arg desc "$(git log -1 --pretty=%s | jq -Rs . | sed 's/^"//;s/"$//')" \
            --arg author "$(git log -1 --pretty=%an)" \
            --arg sha "$(git rev-parse --short HEAD)" \
            --arg url "$RUN_URL" \
            '{
              username: "Libo Deploy",
              embeds: [{
                title: "🔴 liboworld.com deploy failed",
                description: ("**" + $desc + "**\n`" + $sha + "` by " + $author),
                color: 15548997,
                fields: [{
                  name: "The site is now stale",
                  value: "Nothing shipped. This commit and anything pushed after it stay unbuilt until the failure is fixed.",
                  inline: false
                }],
                url: $url
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK" \
            && echo "Alert sent." || echo "Alert failed to send (not failing the run)."
