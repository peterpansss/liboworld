name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build React app ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # `npm install` instead of `npm ci`. The "strict" approach has bitten
      # us in both directions: a macOS-generated lockfile fails on Linux
      # (`EBADPLATFORM` on aix-ppc64), and a Linux-regenerated lockfile fails
      # too (only locks linux-x64, npm ci then complains about missing
      # linux-ppc64/riscv64/etc). `npm install` reconciles silently. The
      # tradeoff is tiny version drift between builds — `tsc -b` catches
      # anything that matters. Keep this until the npm cross-platform
      # optional-dep story stabilizes.
      - run: npm install --no-audit --no-fund
        working-directory: react-app

      # tsc catches pure type errors that vite's bundle-time check misses
      # (mismatched signatures, narrowing bugs, etc). Cheap — runs in ~2s.
      - name: Type-check React app
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: react-app

      # Vite inlines `import.meta.env.VITE_*` at build time, so the
      # secrets must be present in the build step's env. Configure these
      # in repo settings → Secrets and variables → Actions:
      #   - VITE_SUPABASE_URL          (required — module load throws if missing)
      #   - VITE_SUPABASE_ANON_KEY     (required — anon JWT for the project)
      #   - VITE_STRIPE_PUBLISHABLE_KEY (optional — pk_live_… or pk_test_…;
      #     funnel falls back to offline placeholder when absent)
      #   - VITE_STRIPE_PRICE_ENTRY / _SILVER / _GOLD / _PREMIUM (optional)
      #
      # `npm run build` runs `prebuild:facets && tsc -b && vite build && postbuild:seo`,
      # which generates workout facets, sitemap.xml, and prerenders per-route
      # meta tags into dist/exercises/<slug>/index.html etc.
      - name: Build React app
        run: npm run build
        working-directory: react-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_ENTRY: ${{ secrets.VITE_STRIPE_PRICE_ENTRY }}
          VITE_STRIPE_PRICE_SILVER: ${{ secrets.VITE_STRIPE_PRICE_SILVER }}
          VITE_STRIPE_PRICE_GOLD: ${{ secrets.VITE_STRIPE_PRICE_GOLD }}
          VITE_STRIPE_PRICE_PREMIUM: ${{ secrets.VITE_STRIPE_PRICE_PREMIUM }}

      # ── Merge root static files into dist ──
      # The root index.html is the main landing page.
      # Copy it + supporting files into the React dist folder
      # so everything deploys together in one FTP push.
      - name: Copy root static files into dist
        run: |
          cp -r i18n react-app/dist/i18n
          cp tokens.css react-app/dist/tokens.css
          cp robots.txt react-app/dist/robots.txt
          cp sitemap.xml react-app/dist/sitemap.xml
          cp googlea384516e7c52bfef.html react-app/dist/ 2>/dev/null || true
          cp libo-data.js react-app/dist/libo-data.js 2>/dev/null || true

      # ── Deploy everything ──
      - name: Deploy via FTP to Netcup
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: react-app/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
