name: Regenerate package-lock.json on Linux

# Manually triggered helper. Use this whenever the committed
# react-app/package-lock.json drifts to host-platform-specific optional
# deps (typically after someone runs `npm install` on macOS or Windows
# and commits the result — `npm ci` then fails on the Linux deploy runner
# with EBADPLATFORM).
#
# Usage:  Actions tab → "Regenerate package-lock.json on Linux" → Run workflow
# Commits the fresh lockfile back to the branch it was triggered on.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Persist the default GITHUB_TOKEN so the later push works.
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Regenerate lockfile
        working-directory: react-app
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # LIBO-12: a lockfile regenerated from the network is a dependency change
      # and must be reviewed, not pushed straight to main. Push it to a dedicated
      # branch and open a PR for a human to merge.
      - name: Push regenerated lockfile to a review branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add react-app/package-lock.json
          if git diff --staged --quiet; then
            echo "No lockfile changes — nothing to commit."
            exit 0
          fi
          BRANCH="ci/lockfile-regen-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore(ci): regenerate package-lock.json on Linux"
          git push origin "$BRANCH"
          echo "Pushed $BRANCH — open a PR to review the dependency change:"
          echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
