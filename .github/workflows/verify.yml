name: Verify (lint + type-check + tests)

# PR and branch visibility for lint, type-check, and tests. deploy.yml now runs
# lint and tests against its own installed dependencies before publication, so
# a red check stops the production upload. Require this workflow in branch
# protection to prevent direct pushes to main (GitHub setting, not repo code).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: react-app
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: react-app
      - name: Lint
        run: npm run lint
        working-directory: react-app
      - name: Tests
        run: npm run test:run
        working-directory: react-app
